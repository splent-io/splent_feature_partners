[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_partners"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [

]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.splent]
cli_version = "1.11.0"

# ── Feature Contract (auto-generated) ────────────────────────────────────────
# Do not edit manually — re-run `splent feature:contract --write` to refresh.
# Preserved across refreshes: description, category, tags, env, and
# requires.features_manual (dependencies invisible to static analysis).
[tool.splent.contract]
description = "Partner logos and links (home section + admin CRUD)"
archetype = "full"

[tool.splent.contract.provides]
routes     = ["/admin/partners", "/admin/partners/<int:id>/delete", "/admin/partners/<int:id>/edit", "/admin/partners/new", "/partners"]
blueprints = []
models     = ["Partner"]
commands   = ["hello"]
hooks      = ["home.section", "layout.authenticated_sidebar"]
services   = ["PartnersService"]
signals    = []
translations = []
docker     = []

[tool.splent.contract.requires]
features = ["media"]
env_vars = []
signals  = []

[tool.splent.contract.extensible]
services  = ["PartnersService"]
templates = ["partners/admin/form.html", "partners/admin/list.html", "partners/index.html", "partners/strip.html"]
models    = ["Partner"]
hooks     = ["home.section", "layout.authenticated_sidebar"]
routes    = false
